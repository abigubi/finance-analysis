name: Quant Research Terminal checks
on:
  pull_request:
    paths:
      - "Quant/Research_Terminal.py"
      - "Quant/research_signals.py"
      - "tests/test_research_signals.py"
      - ".github/workflows/quant-research.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install required packages
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q Quant/Research_Terminal.py Quant/research_signals.py tests/test_research_signals.py
      - name: Run causal backtest unit tests
        run: python -m unittest discover -s tests -p test_research_signals.py -v
